<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>data type</title>
</head>
<body>
    <!-- 
    data types:
    there are 2 types
    1.primitive datatype
    2.non-promitive datatype

    1.primitives datatype
     there are  7 types of datatype

     number, null ,symbal,String ,boolean,bigInt ,undefind

     2 non-primitive datatype 

     Object
    
 -->


 <script>

    let age=22    //number
    let isnullvalue=null;  //object
    let name="mahesh"; //String
    let friends=["mahesh","madhu","hariesh","hariesh","venky","hema","monika"]; //object
    let marks={    //object
        spring:33,
        hibernate:66,
        java:77,
        html:88,
        css:99,
        javascript:66

    }
    let issymbol=Symbol("how are your"); //symbol

    let ismale=true;    //boolean

    let bigintvalue=BigInt(15548556688); //bigint
   

    let isvalues;  //undefined

    console.log(age,typeof age);
    console.log(name,typeof name);
    console.log(isvalues,typeof isvalues);
    console.log(bigintvalue,typeof bigintvalue);

    console.log(ismale, typeof ismale);
    console.log(isnullvalue,typeof isnullvalue);

    console.log(friends,typeof friends);

    console.log(issymbol,typeof issymbol);
    console.log(marks,typeof marks);

    
 </script>

</body>
</html>
