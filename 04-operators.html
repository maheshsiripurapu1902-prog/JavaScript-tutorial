        // 1   arthematic operator-1
        // + ,- , * , /, ** , ++ ,--

        let a=54;
        let b=66;

        console.log(" a+b = ",a+b);

        console.log("a-b = ", a-b);
        console.log(" a * b =",a*b);
        console.log("a / b", a/b);

        console.log(" a ** b", a**b);

        console.log("a++",a++);
        console.log(a);
        console.log("b-- ",b--);
        console.log(b);
